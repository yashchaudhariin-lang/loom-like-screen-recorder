<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Recur — Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{background:#0d0d10;color:rgba(255,255,255,.9);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
    /* layout */
    .page{min-height:100vh;display:flex;flex-direction:column;}
    .hdr{display:flex;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;}
    .logo{display:flex;align-items:center;gap:8px;}
    .ldot{width:10px;height:10px;border-radius:50%;background:#ff3b3b;flex-shrink:0;}
    .lname{font-size:13px;font-weight:600;color:rgba(255,255,255,.75);letter-spacing:.03em;}
    .lsep{font-size:13px;color:rgba(255,255,255,.2);margin-left:4px;}
    .hmeta{margin-left:auto;display:flex;align-items:center;gap:16px;}
    .mtxt{font-size:12px;font-family:'DM Mono',monospace;color:rgba(255,255,255,.3);}
    .dlbtn{display:flex;align-items:center;gap:7px;padding:7px 16px;border-radius:10px;font-size:12px;font-weight:600;background:#ff3b3b;color:white;border:none;cursor:pointer;box-shadow:0 3px 14px rgba(255,59,59,.3);transition:filter .15s,transform .1s;}
    .dlbtn:hover{filter:brightness(1.12);}
    .dlbtn:active{transform:scale(.97);}
    .dlbtn.done{background:rgba(255,255,255,.07);color:rgba(255,255,255,.45);box-shadow:none;border:1px solid rgba(255,255,255,.1);}
    /* main */
    .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:20px;}
    .vwrap{width:100%;max-width:900px;border-radius:14px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 80px rgba(0,0,0,.7);position:relative;}
    video{width:100%;display:block;}
    .pov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .pov.gone{display:none;}
    .pcircle{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:white;transition:transform .15s,background .15s;}
    .pov:hover .pcircle{transform:scale(1.07);background:rgba(0,0,0,.8);}
    /* controls */
    .ctrls{width:100%;max-width:900px;background:rgba(22,22,26,.9);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
    input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.1);cursor:pointer;outline:none;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#ff3b3b;cursor:pointer;box-shadow:0 0 0 3px rgba(255,59,59,.2);}
    .crow{display:flex;align-items:center;gap:10px;}
    .cpbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:white;cursor:pointer;transition:background .15s,transform .1s;flex-shrink:0;}
    .cpbtn:hover{background:rgba(255,255,255,.12);}
    .cpbtn:active{transform:scale(.94);}
    .ttxt{font-family:'DM Mono',monospace;font-size:12px;color:rgba(255,255,255,.4);}
    .tsep{color:rgba(255,255,255,.18);}
    .fnm{margin-left:auto;font-size:11px;font-family:'DM Mono',monospace;color:rgba(255,255,255,.25);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;}
    .hint{font-size:11px;color:rgba(255,255,255,.22);text-align:center;}
    /* states */
    .center{min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .sbox{text-align:center;max-width:320px;padding:24px;}
    .sicon{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.05);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
    .smsg{font-size:13px;color:rgba(255,255,255,.45);line-height:1.5;}
    .spinner{width:28px;height:28px;border-radius:50%;border:2.5px solid rgba(255,255,255,.1);border-top-color:rgba(255,255,255,.5);animation:sp .75s linear infinite;margin:0 auto 16px;}
    @keyframes sp{to{transform:rotate(360deg);}}
    @keyframes fi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
    .fi{animation:fi .25s ease-out;}
  </style>
</head>
<body>
<div id="app"></div>
<script src="preview.js"></script>
</body>
</html>
